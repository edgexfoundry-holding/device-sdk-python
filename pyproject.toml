[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "device_sdk_py"
version = "4.0.0"
authors = [
  { name="YIQISOFT" },
]
description = "The python-based EdgeX Foundry Device Service SDK (port of edgexfoundry/device-sdk-go)"
readme = "README.md"
license = { text = "Apache 2 License" }
requires-python = ">=3.10"
classifiers = [
    'License :: OSI Approved :: Apache Software License',
    'Intended Audience :: Developers',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12'
]
dependencies = [
    "numpy==1.26.4",
    "typing_extensions==4.12.0",
    "pyyaml==6.0.1",
    "dacite==1.8.1",
    "requests==2.34.2",
    "fastapi~=0.111.1",
    "isodate==0.6.1",
    "uvicorn==0.30.3",
    "paho-mqtt==2.1.0",
    "nats-py==2.8.0",
    "deepdiff==7.0.1",
    "xmltodict==0.13.0",
    "panzi-json-logic==1.0.1",
    "pycryptodomex==3.20.0",
    "dataclasses-json==0.6.7",
    "cbor2~=5.6.5",
    "PyJWT==2.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest~=8.2.0",
    "pytest-cov~=5.0.0",
]

[project.urls]
Homepage = "https://github.com/edgexfoundry/device-sdk-python"
Issues = "https://github.com/edgexfoundry/device-sdk-python/issues"

[tool.setuptools.packages.find]
where = ["src"]
