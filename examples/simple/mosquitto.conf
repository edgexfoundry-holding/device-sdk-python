# Mosquitto configuration for EdgeX local development
# Allows anonymous access for simplicity in dev

listener 1883
allow_anonymous true

# WebSocket listener for browser-based MQTT clients
listener 9001
protocol websockets

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_type all
log_dest stdout

# Message size limits
message_size_limit 0
max_inflight_messages 100
max_queued_messages 1000